<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Auth Sync</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div>
          <h1>Codex Auth Sync</h1>
          <p id="status" class="status">正在读取 ChatGPT session...</p>
        </div>
        <button id="refreshButton" class="icon-button" type="button" title="重新读取" aria-label="重新读取">
          <span aria-hidden="true">↻</span>
        </button>
      </header>

      <section class="editor-wrap" aria-label="auth.json 内容">
        <textarea id="authOutput" spellcheck="false" readonly></textarea>
        <div class="actions">
          <button id="copyButton" type="button" disabled>复制</button>
          <button id="saveButton" type="button" disabled>同步到Codex</button>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
